# Race results -- hand-maintained. Rendered by the {% race_chart %} tag
# (_plugins/race_chart.rb) on pages/running.html.
#
# Fields
#   event     marathon | half | other. Only marathon and half are plotted;
#             `other` rows appear in the results table only.
#   name      race name, shown in the table.
#   date      unquoted ISO date (2024-11-03). Keep it unquoted: quoting makes
#             YAML hand back a string instead of a date, and while the chart
#             math is timezone-proof either way, the table's date formatting
#             relies on getting a real date.
#   time      official finish time, "H:MM:SS" or "MM:SS". Leave empty for a
#             DNF/DNS -- the row then shows in the table but not the chart.
#   pr        optional; true directly labels that point on the chart.
#   location  optional; table only.
#   notes     optional; table only.
#   status    optional; shown in place of the time for a DNF/DNS.
#   distance_mi  required only for `event: other`, to compute its pace.
#
# Order does not matter -- the chart sorts by date and the table sorts newest
# first.

